<!DOCTYPE html>
<html class="h-100" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Velocímetro digital para atividades físicas. Meça sua velocidade em tempo real.">
    <title>Move Speed | Velocímetro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body class="h-100">

    <div class="container d-flex flex-column justify-content-between h-100 py-3">

        <nav class="navbar justify-content-between align-items-center">
            <span class="fw-bold text-dark">Move Speed</span>
            <a class="btn btn-close border border-dark p-2" href="./index.html" aria-label="Voltar"></a>
        </nav>

        <div class="d-flex flex-column justify-content-center align-items-center bg-dark text-light flex-fill mb-3 rounded-3 py-4">
            <span class="fw-bold display-speed" id="speed">0</span>
            <span class="fs-3">Km/h</span>
            <span class="mt-3 text-secondary" id="status">Pronto para começar</span>
        </div>

        <button class="btn btn-primary mb-2 py-3" id="start">
            <span class="fs-2">Start</span>
        </button>

        <button class="btn btn-danger d-none mb-2 py-3" id="stop">
            <span class="fs-2">Stop</span>
        </button>

        <p class="text-center text-muted small mb-0">
            Funciona melhor em dispositivos móveis com GPS ativo.
        </p>

    </div>

    <script src="../JS/speedmeter.js"></script>

</body>

</html>
